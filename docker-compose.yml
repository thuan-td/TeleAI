services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teleapo
      POSTGRES_PASSWORD: teleapo
      POSTGRES_DB: teleapo
    ports:
      - "5432:5432"
    volumes:
      - teleapo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teleapo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://teleapo:teleapo@postgres:5432/teleapo
    ports:
      - "8008:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8008
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  teleapo_pgdata:
